<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Planner</title><link rel="stylesheet" href="style.css?v=1"><meta name="theme-color" content="#163b39"></head><body><header><div><small>ORGANIZE · PREPARE · TEACH</small><h1>Personal Planner</h1></div><button id="logout" hidden>Sign out</button></header><main><p id="message" role="status" aria-live="polite">Connecting…</p><section id="login" hidden><h2>Welcome back</h2><p>Sign in with the account you created in Firebase.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><small>Your session is remembered on this browser.</small></section><section id="planner" hidden><div class="stats"><div>Upcoming<strong id="upcoming">0</strong></div><div>Unscheduled<strong id="unscheduled">0</strong></div><div>Preparing<strong id="preparing">0</strong></div><div>Completed<strong id="completed">0</strong></div></div><nav><button data-view="all" class="active">All plans</button><button data-view="upcoming">Upcoming</button><button data-view="ideas">Unscheduled</button><button data-view="history">History</button></nav><div class="toolbar"><input id="search" placeholder="Search plans…" aria-label="Search plans"><button id="newPlan">+ New plan</button></div><div id="list"></div><form id="editor" hidden><h2 id="editorTitle">New plan</h2><div class="fields"><label class="wide">Title<input name="title" required maxlength="200"></label><label>Category<input name="category" list="categories" required value="Bible Class"><datalist id="categories"><option>Bible Class</option><option>Sermon</option><option>Youth Meeting</option><option>Ministry</option><option>Personal</option></datalist></label><label>Status<select name="status"><option>Planned</option><option>Preparing</option><option>Ready</option><option>Completed</option></select></label><label>Date (optional)<input name="date" type="date"></label><label>Time<input name="time" type="time"></label><label>Scripture<input name="scripture"></label><label>Reference / book<input name="reference"></label><label>Location<input name="location"></label><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Low</option></select></label><label class="wide">Notes<textarea name="notes" rows="4"></textarea></label></div><div class="toolbar"><button type="submit" id="save">Save plan</button><button type="button" id="cancel" class="secondary">Cancel</button></div></form></section></main><footer>Personal Planner · V1.0</footer><script type="module" src="script.js?v=1"></script></body></html>
